<app-dialog
  [header]="spaceToEdit() ? 'Update Space' : 'Create Space'"
  [(visible)]="visible"
  [confirmLabel]="spaceToEdit() ? 'Save Changes' : 'Create'"
  confirmSeverity="warn"
  cancelLabel="Cancel"
  (confirm)="confirmAddSpace()"
  (cancel)="cancelAddSpace()">
  <div class="flex flex-col gap-4 py-2">
    <div class="flex flex-col gap-1.5">
      <label for="name" class="text-sm font-bold text-slate-700"
        >Name <span class="text-red-500">*</span></label
      >
      <input
        pInputText
        id="name"
        [(ngModel)]="spaceData().name"
        placeholder="e.g. Project Alpha"
        class="w-full !rounded-lg !border-gray-200 focus:!border-orange-500 focus:!ring-1 focus:!ring-orange-500" />
    </div>

    <div class="flex flex-col gap-1.5" *ngIf="!spaceToEdit()">
      <label for="type" class="text-sm font-bold text-slate-700">Type</label>
      <p-select
        id="type"
        [options]="typeOptions"
        [(ngModel)]="spaceData().spaceType"
        optionLabel="label"
        optionValue="value"
        placeholder="Select a type"
        styleClass="w-full !border-gray-200 !rounded-lg focus:!border-orange-500"></p-select>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="description" class="text-sm font-bold text-slate-700">Description</label>
      <textarea
        pTextarea
        id="description"
        [(ngModel)]="spaceData().description"
        placeholder="What's this space for?"
        class="w-full !rounded-lg !border-gray-200 focus:!border-orange-500 focus:!ring-1 focus:!ring-orange-500"
        rows="3"></textarea>
    </div>
  </div>
</app-dialog>
