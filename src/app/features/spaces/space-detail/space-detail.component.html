<div class="max-w-7xl mx-auto p-8">
  <!-- Header -->
  <div class="flex items-center justify-between mb-10">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 leading-tight">Workspace Tasks</h1>
      <div class="flex items-center gap-2 mt-2">
        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-50 text-green-600 uppercase tracking-wider">Active</span>
        <span class="text-xs text-gray-400">ID: {{ spaceId() }}</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button class="p-2 text-gray-400 hover:text-gray-600 transition-colors">
        <i class="pi pi-search text-lg"></i>
      </button>
      <button class="p-2 text-gray-400 hover:text-gray-600 transition-colors">
        <i class="pi pi-filter text-lg"></i>
      </button>
      <button class="flex items-center gap-2 bg-black text-white px-5 py-2.5 rounded-xl hover:bg-gray-800 transition-all shadow-sm active:scale-95 ml-2">
        <i class="pi pi-plus text-xs"></i>
        <span class="text-sm font-bold">New Task</span>
      </button>
    </div>
  </div>

  <!-- Task Table -->
  <div class="card overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <p-table
      [value]="tasks()"
      [rows]="10"
      [paginator]="tasks().length > 0"
      [responsiveLayout]="'scroll'"
      styleClass="p-datatable-sm"
      stripedRows 
      [tableStyle]="{ 'min-width': '60rem' }">
      
      <ng-template pTemplate="header">
        <tr class="bg-gray-50">
          <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500 w-[25%]">Title</th>
          <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">Status</th>
          <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">Priority</th>
          <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">Assigned</th>
          <th class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">Start Date</th>
          <th class="px-4 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500">Due Date</th>
          <th class="px-4 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-task>
        <tr class="border-b border-gray-100 transition-colors hover:bg-gray-50/50 group cursor-pointer">
          <!-- Title & Description -->
          <td class="px-4 py-4">
            <div class="flex items-start gap-3">
              <div class="flex flex-col">
                <span class="font-medium text-gray-700 text-sm group-hover:text-black transition-colors">{{ task.title }}</span>
              </div>
            </div>
          </td>

          <!-- Status -->
          <td class="px-4 py-4">
            <app-badge [variant]="getStatusSeverity(task.status)">{{ task.status }}</app-badge>
          </td>

          <!-- Priority -->
          <td class="px-4 py-4">
            <app-badge [variant]="getPrioritySeverity(task.priority)">{{ task.priority }}</app-badge>
          </td>

          <!-- Assigned To -->
          <td class="px-4 py-4">
            <div class="flex items-center gap-2" *ngIf="task.assignedUser; else unassigned">
              <p-avatar 
                [image]="task.assignedUser.avatarUrl" 
                shape="circle" 
                size="normal"
                styleClass="w-6 h-6 border border-gray-100"
                [pTooltip]="task.assignedUser.fullName"
                tooltipPosition="top">
              </p-avatar>
            </div>
            <ng-template #unassigned>
              <span class="text-xs text-gray-400 italic">-</span>
            </ng-template>
          </td>

          <!-- Start Date -->
          <td class="px-4 py-4">
            <div class="flex items-center gap-2 text-gray-500" *ngIf="task.startDate; else noDate">
               <i class="pi pi-calendar text-xs"></i>
               <span class="text-xs">{{ task.startDate }}</span>
            </div>
            <ng-template #noDate>
                <span class="text-xs text-gray-300">-</span>
            </ng-template>
          </td>
          
          <!-- Due Date -->
          <td class="px-4 py-4">
            <div class="flex items-center gap-2 text-gray-500" *ngIf="task.dueDate; else noDate">
               <i class="pi pi-calendar text-xs"></i>
               <span class="text-xs">{{ task.dueDate }}</span>
            </div>
            <ng-template #noDate>
                <span class="text-xs text-gray-300">-</span>
            </ng-template>
          </td>

          <!-- Actions -->
          <td class="px-4 py-4 text-right">
            <button class="p-1.5 text-gray-300 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-all opacity-0 group-hover:opacity-100">
              <i class="pi pi-ellipsis-h"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="py-12 text-center text-gray-500">
            <div class="flex flex-col items-center gap-2">
              <i class="pi pi-list text-4xl text-gray-300"></i>
              <span class="text-lg">No tasks found</span>
              <button class="px-4 py-2 mt-2 text-sm text-blue-600 hover:text-blue-700 font-medium">Create your first task</button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="footer">
         <tr>
            <td colspan="7" class="p-2">
                 <button class="w-full flex items-center gap-2 p-2 hover:bg-gray-50 rounded-lg text-gray-500 hover:text-gray-800 transition-colors text-sm">
                    <i class="pi pi-plus ml-2"></i>
                    <span>New Task</span>
                 </button>
            </td>
         </tr>
      </ng-template>

    </p-table>
  </div>
</div>
