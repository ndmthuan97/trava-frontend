<div class="mx-auto max-w-7xl p-8">
  <!-- Header -->
  <div class="mb-10 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold leading-tight text-gray-900">Workspace Tasks</h1>
    </div>
    <div class="flex items-center gap-3">
      <button class="p-2 text-gray-400 transition-colors hover:text-gray-600">
        <i class="pi pi-search text-lg"></i>
      </button>
      <button class="p-2 text-gray-400 transition-colors hover:text-gray-600">
        <i class="pi pi-filter text-lg"></i>
      </button>
      <button
        class="ml-2 flex items-center gap-2 rounded-xl bg-black px-5 py-2.5 text-white shadow-sm transition-all hover:bg-gray-800 active:scale-95">
        <i class="pi pi-plus text-xs"></i>
        <span class="text-sm font-bold">New Task</span>
      </button>
    </div>
  </div>

  <!-- Task Table -->
  <div class="card overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <p-table
      [value]="tasks()"
      [rows]="10"
      [paginator]="tasks().length > 0"
      [responsiveLayout]="'scroll'"
      styleClass="p-datatable-sm"
      stripedRows
      [tableStyle]="{ 'min-width': '60rem' }">
      <ng-template pTemplate="header">
        <tr class="bg-gray-50">
          <th
            class="w-[25%] px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Title
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Status
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Priority
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Assigned
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Start Date
          </th>
          <th
            class="px-4 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500">
            Due Date
          </th>
          <th
            class="px-4 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500">
            Actions
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-task>
        <tr
          class="group cursor-pointer border-b border-gray-100 transition-colors hover:bg-gray-50/50">
          <!-- Title & Description -->
          <td class="px-4 py-4">
            <div class="flex items-start gap-3">
              <div class="flex flex-col">
                <span
                  class="text-sm font-medium text-gray-700 transition-colors group-hover:text-black"
                  >{{ task.title }}</span
                >
              </div>
            </div>
          </td>

          <!-- Status -->
          <td class="px-4 py-4">
            <app-badge [variant]="getStatusSeverity(task.status)">{{ task.status }}</app-badge>
          </td>

          <!-- Priority -->
          <td class="px-4 py-4">
            <app-badge [variant]="getPrioritySeverity(task.priority)">{{
              task.priority
            }}</app-badge>
          </td>

          <!-- Assigned To -->
          <td class="px-4 py-4">
            <div
              class="flex items-center justify-center gap-2"
              *ngIf="task.assignedUser; else unassigned">
              <p-avatar
                [image]="task.assignedUser.avatarUrl"
                shape="circle"
                size="normal"
                styleClass="w-6 h-6 border border-gray-100"
                [pTooltip]="task.assignedUser.fullName"
                tooltipPosition="top">
              </p-avatar>
            </div>
            <ng-template #unassigned>
              <span class="text-xs italic text-gray-400">-</span>
            </ng-template>
          </td>

          <!-- Start Date -->
          <td class="px-4 py-4">
            <div class="flex items-center gap-2 text-gray-500" *ngIf="task.startDate; else noDate">
              <i class="pi pi-calendar text-xs"></i>
              <span class="text-xs">{{ task.startDate }}</span>
            </div>
            <ng-template #noDate>
              <span class="text-xs text-gray-300">-</span>
            </ng-template>
          </td>

          <!-- Due Date -->
          <td class="px-4 py-4">
            <div class="flex items-center gap-2 text-gray-500" *ngIf="task.dueDate; else noDate">
              <i class="pi pi-calendar text-xs"></i>
              <span class="text-xs">{{ task.dueDate }}</span>
            </div>
            <ng-template #noDate>
              <span class="text-xs text-gray-300">-</span>
            </ng-template>
          </td>

          <!-- Actions -->
          <td class="px-4 py-4 text-right">
            <button
              class="rounded-lg p-1.5 text-gray-300 opacity-0 transition-all hover:bg-gray-100 hover:text-gray-600 group-hover:opacity-100">
              <i class="pi pi-ellipsis-h"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="py-12 text-center text-gray-500">
            <div class="flex flex-col items-center gap-2">
              <i class="pi pi-list text-4xl text-gray-300"></i>
              <span class="text-lg">No tasks found</span>
              <button class="mt-2 px-4 py-2 text-sm font-medium text-blue-600 hover:text-blue-700">
                Create your first task
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="footer">
        <tr>
          <td colspan="7" class="p-2">
            <button
              class="flex w-full items-center gap-2 rounded-lg p-2 text-sm text-gray-500 transition-colors hover:bg-gray-50 hover:text-gray-800">
              <i class="pi pi-plus ml-2"></i>
              <span>New Task</span>
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
