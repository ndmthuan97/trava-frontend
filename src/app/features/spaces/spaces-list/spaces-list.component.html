<div class="max-w-7xl w-full mx-auto pb-20">
  <!-- Mockup style header -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-[10px] font-bold uppercase tracking-wider text-gray-400">
      Workspaces
    </h2>
    
    <!-- Search UI mimicking header -->
    <div class="flex items-center gap-3">
      <div class="flex h-[40px] items-center gap-2 rounded-xl border border-gray-200 bg-gray-100 px-4 transition-all focus-within:border-gray-400 focus-within:bg-white">
        <i class="pi pi-search text-gray-400 text-xs"></i>
        <input
          type="text"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchTriggered($event)"
          placeholder="Search spaces..."
          class="w-48 bg-transparent text-xs text-gray-900 placeholder-gray-400 focus:outline-none" />
      </div>
      <button
        class="ml-2 flex h-[40px] items-center gap-2 rounded-xl bg-black px-5 text-white shadow-sm transition-all hover:bg-gray-800 active:scale-95"
        (click)="addSpace()">
        <i class="pi pi-plus text-xs"></i>
        <span class="text-sm font-bold">Add</span>
      </button>
    </div>
  </div>

  <!-- Space cards grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <app-space-card
      *ngFor="let space of spaces()"
      [space]="space"
      [open]="true"
      (click)="onSpaceSelect(space)"
      class="hover:scale-[1.02] transition-transform duration-200 cursor-pointer"
    />
  </div>

  <!-- Empty state -->
  <div *ngIf="spaces().length === 0" class="flex flex-col items-center justify-center py-20 bg-white rounded-2xl border-2 border-dashed border-gray-100 mt-4">
    <i class="pi pi-box text-5xl text-gray-200 mb-4"></i>
    <p class="text-gray-400 font-medium">No workspaces found</p>
    <button (click)="addSpace()" class="mt-4 text-black font-bold hover:underline">
      Create your first workspace
    </button>
  </div>
</div>

<app-create-space [(visible)]="showAddSpaceDialog" (created)="loadSpaces()" />
