<div class="mx-auto max-w-7xl px-4 py-8 pb-20">
  <!-- Standardized Header -->
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-gray-900">Space Management</h1>
      <p class="mt-1 text-xs text-gray-500">
        Organize and manage your collaborative work environments
      </p>
    </div>

    <div class="flex items-center gap-2">
      <!-- Standardized Search UI -->
      <div
        class="flex h-[36px] items-center gap-2 rounded-lg border border-gray-200 bg-white px-3 transition-all focus-within:border-orange-400 focus-within:ring-2 focus-within:ring-orange-50">
        <i class="pi pi-search text-[10px] text-gray-400"></i>
        <input
          type="text"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchTriggered($event)"
          placeholder="Search spaces..."
          class="w-48 bg-transparent text-xs text-gray-900 placeholder-gray-400 focus:outline-none" />
      </div>

      <button
        (click)="opType.toggle($event)"
        class="flex h-[36px] items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3 text-xs font-semibold text-gray-600 transition-all hover:border-orange-300 hover:bg-gray-50 active:scale-95">
        <i class="pi pi-briefcase text-[10px]"></i>
        <span>Type</span>
        <span
          *ngIf="filterType() !== null"
          class="ml-1 flex h-4 w-4 items-center justify-center rounded-full bg-orange-600 text-[8px] text-white"
          >1</span
        >
        <i class="pi pi-chevron-down ml-1 text-[8px] opacity-50"></i>
      </button>

      <!-- Role Filter -->
      <button
        (click)="opRole.toggle($event)"
        class="flex h-[36px] items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3 text-xs font-semibold text-gray-600 transition-all hover:border-orange-300 hover:bg-gray-50 active:scale-95">
        <i class="pi pi-wrench text-[10px]"></i>
        <span>Role</span>
        <span
          *ngIf="filterRole() !== null"
          class="ml-1 flex h-4 w-4 items-center justify-center rounded-full bg-orange-600 text-[8px] text-white"
          >1</span
        >
        <i class="pi pi-chevron-down ml-1 text-[8px] opacity-50"></i>
      </button>

      <!-- Add Button -->
      <button
        class="flex h-[36px] items-center gap-2 rounded-lg bg-orange-600 px-4 text-white shadow-sm transition-all hover:bg-orange-700 active:scale-95"
        (click)="addSpace()">
        <i class="pi pi-plus text-[10px]"></i>
        <span class="text-xs font-bold">New Space</span>
      </button>
    </div>
  </div>

  <p-popover #opType styleClass="filter-overlay-premium">
    <div class="flex w-48 flex-col gap-1 p-2">
      <span class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-gray-400"
        >Filter Type</span
      >
      <button
        (click)="onFilterTypeChange(null); opType.hide()"
        class="filter-option-btn"
        [class.active]="filterType() === null">
        All Types
      </button>
      <button
        *ngFor="let opt of typeFilterOptions"
        (click)="onFilterTypeChange(opt.value); opType.hide()"
        class="filter-option-btn"
        [class.active]="filterType() === opt.value">
        {{ opt.label }}
      </button>
    </div>
  </p-popover>

  <p-popover #opRole styleClass="filter-overlay-premium">
    <div class="flex w-48 flex-col gap-1 p-2">
      <span class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-gray-400"
        >Filter Role</span
      >
      <button
        (click)="onFilterRoleChange(null); opRole.hide()"
        class="filter-option-btn"
        [class.active]="filterRole() === null">
        All Roles
      </button>
      <button
        *ngFor="let opt of roleFilterOptions"
        (click)="onFilterRoleChange(opt.value); opRole.hide()"
        class="filter-option-btn"
        [class.active]="filterRole() === opt.value">
        {{ opt.label }}
      </button>
    </div>
  </p-popover>

  <!-- Space cards grid -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    <app-space-card
      *ngFor="let space of spaces()"
      [space]="space"
      [open]="true"
      (click)="onSpaceSelect(space)"
      (edit)="onEditSpace($event)"
      (delete)="onDeleteSpace($event)"
      class="cursor-pointer transition-transform duration-200 hover:scale-[1.02]" />
  </div>

  <!-- Paginator -->
  <div class="mt-10" *ngIf="totalCount() > 0">
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="(pageIndex() - 1) * pageSize()"
      [rows]="pageSize()"
      [totalRecords]="totalCount()"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} spaces"
      [rowsPerPageOptions]="[8, 16, 32]"
      dropdownStyleClass="paginator-dropdown-up"
      dropdownAppendTo="body"
      styleClass="px-0 py-4 bg-transparent border-t border-gray-100" />
  </div>

  <!-- Empty state -->
  <div
    *ngIf="spaces().length === 0"
    class="mt-4 flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-gray-100 bg-white py-20">
    <i class="pi pi-box mb-4 text-5xl text-gray-200"></i>
    <p class="font-medium text-gray-400">No workspaces found</p>
    <button (click)="addSpace()" class="mt-4 font-bold text-black hover:underline">
      Create your first workspace
    </button>
  </div>
</div>

<app-create-space
  [(visible)]="showAddSpaceDialog"
  [spaceToEdit]="selectedSpaceToEdit()"
  (created)="loadSpaces()" />

<p-confirmDialog>
  <ng-template pTemplate="message" let-message>
    <div [innerHTML]="message.message"></div>
  </ng-template>
</p-confirmDialog>
