<div class="p-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">User Management</h1>
    </div>
    <p-button
      label="Add"
      icon="pi pi-plus"
      iconPos="right"
      size="small"
      [raised]="true"
      severity="primary"></p-button>
  </div>

  <div class="card overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <p-table
      [value]="users()"
      [rows]="10"
      [paginator]="users().length > 0"
      [responsiveLayout]="'scroll'"
      styleClass="p-datatable-sm"
      stripedRows
      [tableStyle]="{ 'min-width': '40rem' }">
      <ng-template pTemplate="header">
        <tr class="bg-gray-50">
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            User
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Email
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Role
          </th>
          <th
            class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
            Status
          </th>
          <th
            class="px-4 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500">
            Actions
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr class="border-b border-gray-100 transition-colors hover:bg-gray-50/50">
          <td class="px-4 py-4">
            <div class="flex items-center gap-3">
              <p-avatar
                [image]="user.avatarUrl"
                shape="circle"
                class="border border-gray-100"></p-avatar>
              <span class="font-medium text-gray-700">{{ user.fullName }}</span>
            </div>
          </td>
          <td class="px-4 py-4">
            <span class="text-gray-600">{{ user.email }}</span>
          </td>
          <td class="px-4 py-4">
            <app-badge [variant]="getRoleSeverity(user.role)">{{ user.role }}</app-badge>
          </td>
          <td class="px-4 py-4">
            <app-badge [variant]="getStatusSeverity(user.status)">{{ user.status }}</app-badge>
          </td>
          <td class="px-4 py-4 text-right">
            <div class="flex justify-start gap-2">
              <p-button
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                severity="secondary"
                size="small"></p-button>
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [text]="true"
                severity="secondary"
                size="small"></p-button>
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                severity="danger"
                size="small"></p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="py-12 text-center text-gray-500">
            <div class="flex flex-col items-center gap-2">
              <i class="pi pi-users text-4xl text-gray-300"></i>
              <span class="text-lg">No users to display</span>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
