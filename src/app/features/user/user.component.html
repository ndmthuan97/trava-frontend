<div class="p-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">User Management</h1>
    </div>
    <div class="flex items-center gap-3">
      <!-- Search UI mimicking header -->
      <div class="flex h-[40px] items-center gap-2 rounded-xl border border-gray-200 bg-gray-100 px-4 transition-all focus-within:border-gray-400 focus-within:bg-white">
        <i class="pi pi-search text-gray-400 text-xs"></i>
        <input
          type="text"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchTriggered($event)"
          placeholder="Search users..."
          class="w-48 bg-transparent text-xs text-gray-900 placeholder-gray-400 focus:outline-none" />
      </div>
      <button
        class="ml-2 flex h-[40px] items-center gap-2 rounded-xl bg-black px-5 text-white shadow-sm transition-all hover:bg-gray-800 active:scale-95">
        <i class="pi pi-plus text-xs"></i>
        <span class="text-sm font-bold">Add</span>
      </button>
    </div>
  </div>

  <div class="card h-full overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <p-table
      [value]="users()"
      [rows]="10"
      [paginator]="true"
      [responsiveLayout]="'scroll'"
      styleClass="p-datatable-sm"
      stripedRows
      [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr class="bg-slate-50">
          <th
            class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">
            User
          </th>
          <th
            class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider text-slate-500">
            Email
          </th>
          <th
            class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider text-slate-500">
            Role
          </th>
          <th
            class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider text-slate-500">
            Status
          </th>
          <th
            class="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-slate-500">
            Actions
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr class="border-b border-slate-100 transition-colors hover:bg-slate-50">
          <td class="px-4 py-4">
            <div class="flex items-center gap-3">
              <p-avatar
                [image]="user.avatarUrl"
                shape="circle"
                size="normal"
                *ngIf="user.avatarUrl"></p-avatar>
              <p-avatar
                icon="pi pi-user"
                shape="circle"
                size="normal"
                *ngIf="!user.avatarUrl"></p-avatar>
              <span class="max-w-[150px] truncate font-medium text-slate-700" [pTooltip]="user.fullName || 'User'" tooltipPosition="top">{{ user.fullName || 'User' }}</span>
            </div>
          </td>
          <td class="px-4 py-4 text-center text-slate-600">
            <div class="max-w-[200px] truncate mx-auto" [pTooltip]="user.email" tooltipPosition="top">
              {{ user.email }}
            </div>
          </td>
          <td class="px-4 py-4 text-center">
            <app-badge [variant]="getRoleSeverity(user.role)">{{ getRoleLabel(user.role) }}</app-badge>
          </td>
          <td class="px-4 py-4 text-center">
            <app-badge [variant]="getStatusSeverity(user.status)">{{ getStatusLabel(user.status) }}</app-badge>
          </td>
          <td class="px-4 py-4 text-right">
            <div class="flex justify-start gap-2">
              <p-button
                *ngIf="currentUser()?.role === UserRoles.SYSTEM_ADMIN"
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                severity="secondary"
                size="small"
                (onClick)="viewProfile(user)"></p-button>
              <p-button
                *ngIf="user.role !== UserRoles.SYSTEM_ADMIN"
                [icon]="user.status === UserStatus.Active ? 'pi pi-lock' : 'pi pi-lock-open'"
                [rounded]="true"
                [text]="true"
                [severity]="user.status === UserStatus.Active ? 'danger' : 'success'"
                size="small"
                (onClick)="onToggleStatus(user)"></p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="py-12 text-center text-gray-500">
            <div class="flex flex-col items-center gap-2">
              <i class="pi pi-users text-4xl text-gray-300"></i>
              <span class="text-lg">No users to display</span>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-confirmDialog></p-confirmDialog>
