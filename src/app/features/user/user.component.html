<div class="px-4 py-8 max-w-7xl mx-auto">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">User Management</h1>
      <p class="text-xs text-gray-500 mt-1">Manage system accounts and access status</p>
    </div>
    <div class="flex items-center gap-2">
      <!-- Search UI -->
      <div class="flex h-[36px] items-center gap-2 rounded-lg border border-gray-200 bg-white px-3 transition-all focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-50">
        <i class="pi pi-search text-gray-400 text-[10px]"></i>
        <input
          type="text"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchTriggered($event)"
          placeholder="Search by name or email..."
          class="w-48 bg-transparent text-xs text-gray-900 placeholder-gray-400 focus:outline-none" />
      </div>

      <!-- Filter Button -->
      <button 
        (click)="opStatus.toggle($event)"
        class="flex h-[36px] items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3 text-xs font-semibold text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-all active:scale-95">
        <i class="pi pi-filter text-[10px]"></i>
        <span>Status</span>
        <span *ngIf="filterStatus() !== null" class="ml-1 flex h-4 w-4 items-center justify-center rounded-full bg-blue-600 text-[8px] text-white">1</span>
        <i class="pi pi-chevron-down text-[8px] ml-1 opacity-50"></i>
      </button>

      <p-overlayPanel #opStatus styleClass="filter-overlay-premium">
        <div class="w-48 p-2 flex flex-col gap-1">
          <span class="text-[10px] font-bold text-gray-400 px-2 py-1 uppercase tracking-wider">Filter Status</span>
          <button (click)="onFilterStatusChange(null); opStatus.hide()" class="filter-option-btn" [class.active]="filterStatus() === null">All Users</button>
          <button (click)="onFilterStatusChange(UserStatus.Active); opStatus.hide()" class="filter-option-btn" [class.active]="filterStatus() === UserStatus.Active">Active Only</button>
          <button (click)="onFilterStatusChange(UserStatus.Inactive); opStatus.hide()" class="filter-option-btn" [class.active]="filterStatus() === UserStatus.Inactive">Locked Only</button>
        </div>
      </p-overlayPanel>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-8">
    <p-table
      [value]="users()"
      [rows]="10"
      [paginator]="users().length > 10"
      [responsiveLayout]="'scroll'"
      styleClass="p-datatable-sm custom-task-table"
      [tableStyle]="{ 'min-width': '60rem' }">
      <ng-template pTemplate="header">
        <tr class="!border-y !border-gray-100">
          <th class="w-[35%] !bg-white !py-4 text-[11px] font-bold text-gray-500 uppercase tracking-wider">User</th>
          <th class="w-[30%] !bg-white !py-4 text-[11px] font-bold text-gray-500 uppercase tracking-wider text-center">Email</th>
          <th class="w-[15%] !bg-white !py-4 text-[11px] font-bold text-gray-500 uppercase tracking-wider text-center">Role</th>
          <th class="w-[15%] !bg-white !py-4 text-[11px] font-bold text-gray-500 uppercase tracking-wider text-center">Status</th>
          <th class="w-[10%] !bg-white !py-4 text-right pr-6 text-[11px] font-bold text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr class="group !border-b !border-gray-50 hover:bg-gray-50/50 transition-all">
          <td class="!py-4">
            <div class="flex items-center gap-3 ml-2">
              <p-avatar 
                [image]="user.avatarUrl" 
                [label]="!user.avatarUrl ? (user.fullName?.substring(0, 1) || 'U') : ''" 
                shape="circle" 
                styleClass="w-9 h-9 border border-gray-100 shadow-sm text-sm font-bold bg-blue-50 text-blue-600"></p-avatar>
              <div class="flex flex-col min-w-0">
                <span class="text-sm font-bold text-gray-900 truncate">{{ user.fullName || 'User' }}</span>
              </div>
            </div>
          </td>
          <td class="!py-4 text-center">
            <span class="text-xs text-gray-600 font-medium">{{ user.email }}</span>
          </td>
          <td class="!py-4 text-center">
            <div [class]="'inline-flex items-center justify-center w-24 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border ' + (user.role === 0 ? 'bg-indigo-50 text-indigo-600 border-indigo-100' : 'bg-gray-100 text-gray-600 border-gray-200')">
              {{ getRoleLabel(user.role) }}
            </div>
          </td>
          <td class="!py-4 text-center">
            <div [class]="'inline-flex items-center justify-center w-24 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border ' + (user.status === 0 ? 'bg-green-50 text-green-600 border-green-100' : 'bg-rose-50 text-rose-600 border-rose-100')">
              {{ getStatusLabel(user.status) }}
            </div>
          </td>
          <td class="!py-4 text-right pr-6">
            <div class="flex justify-end gap-1">
              <button 
                *ngIf="currentUser()?.role === UserRoles.SYSTEM_ADMIN"
                class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-all active:scale-90"
                (click)="viewProfile(user)"
                pTooltip="View Profile">
                <i class="pi pi-eye text-xs"></i>
              </button>
              <button 
                *ngIf="user.role !== UserRoles.SYSTEM_ADMIN"
                [class]="'w-8 h-8 flex items-center justify-center rounded-lg transition-all active:scale-90 ' + (user.status === 1 ? 'text-gray-400 hover:text-rose-600 hover:bg-rose-50' : 'text-gray-400 hover:text-green-600 hover:bg-green-50')"
                (click)="onToggleStatus(user)"
                [pTooltip]="user.status === 1 ? 'Lock User' : 'Unlock User'">
                <i [class]="user.status === 1 ? 'pi pi-lock text-xs' : 'pi pi-lock-open text-xs'"></i>
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="py-12 text-center text-gray-500">
            <div class="flex flex-col items-center gap-2">
              <i class="pi pi-users text-4xl text-gray-300"></i>
              <span class="text-lg">No users to display</span>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-confirmDialog></p-confirmDialog>
