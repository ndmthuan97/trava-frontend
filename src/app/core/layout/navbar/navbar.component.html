<aside
  class="flex flex-col overflow-y-auto border-r border-gray-200 bg-white text-gray-900 transition-all duration-300"
  [ngClass]="open() ? 'w-64' : 'w-20'">
  <!-- Logo -->
  <div class="border-b border-gray-200 p-6">
    <div class="flex items-center gap-3">
      <div
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-black font-bold text-white">
        T
      </div>
      <span *ngIf="open()" class="text-lg font-bold"> Trava </span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 space-y-2 p-4">
    <!-- Menu -->
    <div class="space-y-2">
      <button
        class="flex w-full items-center gap-3 rounded-lg bg-gray-100 px-3 py-2 text-gray-900 hover:bg-gray-200">
        <i class="pi pi-home text-lg"></i>
        <span *ngIf="open()">Dashboard</span>
      </button>

      <!-- Spaces Group -->
      <div>
        <button
          (click)="toggleSpaces()"
          class="group flex w-full items-center justify-between rounded-lg px-3 py-2 hover:bg-gray-200">
          <div class="flex items-center gap-3">
            <i class="pi pi-box text-lg"></i>
            <span *ngIf="open()" class="text-sm">Spaces</span>
          </div>
          <i
            class="pi pi-ellipsis-h opacity-0 group-hover:opacity-100 transition-opacity"
            (click)="openMainSpaceMenu($event, mainSpaceMenu)"></i>
        </button>

        <!-- Sub-spaces list -->
        <div
          *ngIf="open() && isSpacesExpanded()"
          class="mt-1 max-h-[160px] overflow-y-auto space-y-1 pl-9 scrollbar-thin scrollbar-thumb-gray-200">
          <div
            *ngFor="let space of spaces()"
            class="group flex items-center justify-between rounded-md px-2 py-1.5 text-xs text-gray-600 hover:bg-gray-100 hover:text-gray-900 cursor-pointer">
            <div class="flex items-center gap-2 truncate">
              <i class="pi pi-folder text-[10px]"></i>
              <span class="truncate">{{ space.name }}</span>
            </div>
            <i
              class="pi pi-ellipsis-h opacity-0 hover:text-black group-hover:opacity-100 transition-opacity"
              (click)="openSpaceMenu($event, space, itemSpaceMenu)"></i>
          </div>
        </div>
      </div>

      <button class="flex w-full items-center gap-3 rounded-lg px-3 py-2 hover:bg-gray-200">
        <i class="pi pi-user text-lg"></i>
        <span *ngIf="open()" class="text-sm">Users</span>
      </button>

      <!-- Context Menus for Spaces -->
      <p-menu #mainSpaceMenu [model]="mainSpaceMenuItems()" [popup]="true"></p-menu>
      <p-menu #itemSpaceMenu [model]="itemSpaceMenuItems()" [popup]="true"></p-menu>
    </div>
  </nav>

  <app-create-space [(visible)]="showAddSpaceDialog" (created)="loadSpaces()" />
</aside>
