<aside
  class="flex flex-col overflow-y-auto border-r border-gray-200 bg-white text-gray-900 transition-all duration-300"
  [ngClass]="open() ? 'w-64' : 'w-20'">
  <!-- Logo -->
  <div class="border-b border-gray-200 p-6">
    <div class="flex items-center gap-3">
      <div
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-black font-bold text-white">
        T
      </div>
      <span *ngIf="open()" class="text-lg font-bold"> Trava </span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 space-y-2 p-4">
    <!-- Menu -->
    <div class="space-y-2">
      <button
        routerLink="/dashboard"
        routerLinkActive="bg-gray-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-gray-900 hover:bg-gray-200">
        <i class="pi pi-home text-lg"></i>
        <span *ngIf="open()">Dashboard</span>
      </button>

      <button
        routerLink="/spaces"
        routerLinkActive="bg-gray-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-gray-900 hover:bg-gray-200">
        <i class="pi pi-box text-lg"></i>
        <span *ngIf="open()">Spaces</span>
      </button>

      <button
        routerLink="/users"
        routerLinkActive="bg-gray-100"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2 hover:bg-gray-200">
        <i class="pi pi-user text-lg"></i>
        <span *ngIf="open()" class="text-sm">Users</span>
      </button>
    </div>
  </nav>
</aside>
