<div class="w-80 max-h-[400px] flex flex-col bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden">
  <!-- Header -->
  <div class="px-4 py-3 border-b border-gray-100 bg-gray-50/50 flex items-center justify-between">
    <h3 class="text-xs font-bold text-gray-900 uppercase tracking-widest">Invitations</h3>
    <span *ngIf="invitations().length > 0" class="flex h-5 w-5 items-center justify-center rounded-full bg-orange-600 text-[10px] font-bold text-white">
      {{ invitations().length }}
    </span>
  </div>

  <!-- List -->
  <div class="overflow-y-auto custom-scrollbar flex-1">
    <div *ngIf="isLoading()" class="p-8 text-center">
      <i class="pi pi-spin pi-spinner text-orange-600 text-xl"></i>
    </div>

    <ng-container *ngIf="!isLoading()">
      <div *ngFor="let item of invitations()" class="invitation-item">
        <p-avatar 
          [image]="item.payload.AvatarUrl" 
          [label]="!item.payload.AvatarUrl ? (item.payload.SenderName?.substring(0, 1) || 'S') : ''" 
          shape="circle" 
          styleClass="w-10 h-10 flex-shrink-0 text-sm font-bold bg-orange-100 text-orange-600 border border-orange-200">
        </p-avatar>
        
        <div class="flex-1 min-w-0">
          <p class="text-[13px] text-gray-900 leading-snug mb-2">
            <span class="font-bold text-gray-900">{{ item.payload.SenderName || 'Someone' }}</span>
            <span class="text-gray-600 ml-1">invited you to join</span>
            <span class="font-bold text-orange-600 ml-1 block mt-0.5">{{ item.payload.SpaceName || 'a Space' }}</span>
          </p>

          <div class="flex gap-2" *ngIf="!item.isRead">
            <button 
              (click)="respond(item, InvitationStatus.Accepted)"
              class="flex-1 h-8 rounded-lg bg-orange-600 text-white text-[11px] font-bold hover:bg-orange-700 transition-all active:scale-95 flex items-center justify-center gap-1.5 shadow-sm shadow-orange-200">
              <i class="pi pi-check text-[9px]"></i> Accept
            </button>
            <button 
              (click)="respond(item, InvitationStatus.Rejected)"
              class="flex-1 h-8 rounded-lg border border-gray-200 bg-white text-gray-600 text-[11px] font-bold hover:bg-gray-50 transition-all active:scale-95 flex items-center justify-center gap-1.5">
              <i class="pi pi-times text-[9px]"></i> Reject
            </button>
          </div>
          
          <div *ngIf="item.isRead" class="text-[10px] font-bold text-gray-400 mt-1 flex items-center gap-1">
            <i class="pi pi-info-circle text-[9px]"></i>
            Action Already Taken
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="invitations().length === 0" class="p-10 text-center flex flex-col items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center">
          <i class="pi pi-envelope text-gray-300 text-xl"></i>
        </div>
        <div>
          <p class="text-sm font-bold text-gray-900">No invitations</p>
          <p class="text-[11px] text-gray-400 mt-0.5">You're all caught up!</p>
        </div>
      </div>
    </ng-container>
  </div>
</div>
