<header class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-4">
  <!-- Left -->
  <div class="flex items-center gap-4">
    <button (click)="onMenuClick()" class="rounded-lg p-2 transition-colors hover:bg-gray-200">
      <i class="pi pi-bars text-lg text-gray-900"></i>
    </button>

    <h2 class="text-lg font-semibold text-gray-900">Welcome {{ user()?.fullName || 'User' }}!</h2>
  </div>

  <!-- Right -->
  <div class="flex items-center gap-2">
    <!-- Notification -->
    <app-notification />

    <!-- User -->
    <app-information />
  </div>
</header>
