<header class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-4">
  <!-- Left -->
  <div class="flex items-center gap-4">
    <button (click)="onMenuClick()" class="rounded-lg p-2 transition-colors hover:bg-gray-200">
      <i class="pi pi-bars text-lg text-gray-900"></i>
    </button>

    <h2 class="text-lg font-semibold text-gray-900">Welcome Minh Thuan!</h2>
  </div>

  <!-- Right -->
  <div class="flex items-center gap-2">
    <!-- Search -->
    <div
      class="hidden items-center gap-2 rounded-lg border border-gray-200 bg-gray-100 px-4 py-2 md:flex">
      <i class="pi pi-search text-gray-500"></i>
      <input
        type="text"
        placeholder="Search..."
        class="w-48 bg-transparent text-sm text-gray-900 placeholder-gray-400 focus:outline-none" />
    </div>

    <!-- Notification -->
    <app-notification />

    <!-- User -->
    <app-information />
  </div>
</header>
