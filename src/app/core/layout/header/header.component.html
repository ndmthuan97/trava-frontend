<header class="bg-card border-border flex items-center justify-between border-b px-6 py-4">
  <!-- Left -->
  <div class="flex items-center gap-4">
    <button (click)="onMenuClick()" class="hover:bg-muted rounded-lg p-2 transition-colors">
      <i class="pi pi-bars text-foreground text-lg"></i>
    </button>

    <h2 class="text-foreground text-lg font-semibold">Welcome Minh Thuan!</h2>
  </div>

  <!-- Right -->
  <div class="flex items-center gap-2">
    <!-- Search -->
    <div
      class="bg-muted border-border hidden items-center gap-2 rounded-lg border px-4 py-2 md:flex">
      <i class="pi pi-search text-muted-foreground"></i>
      <input
        type="text"
        placeholder="Search..."
        class="text-foreground placeholder-muted-foreground w-48 bg-transparent text-sm focus:outline-none" />
    </div>

    <!-- Notification -->
    <app-notification />

    <!-- User -->
    <app-information />
  </div>
</header>
